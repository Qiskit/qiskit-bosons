---
name: Latest version tests

# This is a reusable workflow, driven by `branch-protection.yml` (for pull requests and the merge
# queue) and by `on-nightly.yml` (for the scheduled run).  It deliberately has no triggers of its own
# beyond `workflow_call`, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true
      python-version:
        description: Python version to test.
        type: string
        required: true

jobs:
  tests:
    # The caller's job name carries the matrix values, which GitHub appends to it, so this only needs
    # to say which suite is running.
    name: latest
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s PEP 735 dependency groups
          # and extras), so the pip wheel cache is keyed on that file.  Coarser than a lockfile: any
          # edit to it, dependency-related or not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      # `Cargo.lock` is committed and pins every dependency to crates.io, so it fully describes what
      # gets downloaded.  Deliberately the registry only, not `target/`.  `restore-keys` is safe here
      # because the registry is content-addressed -- a partial restore is just a warm subset that
      # cargo completes and checksums.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install -U pip

      - name: Install Python package
        shell: bash
        run: |
          pip install --group build --group test qiskit
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e .

      # `testrust` exercises `core` under the `pyext` FFI backend, which needs the installed
      # extension's interpreter, so it runs after the package install. Note that no Qiskit C library
      # is built anywhere in this workflow: linking goes through `qiskit-pyo3-ffi`, which is also what
      # makes the Windows leg viable.
      - name: Rust tests
        shell: bash
        run: |
          make testrust

      - name: Python tests
        shell: bash
        run: |
          make pystubs testpython

      # `make testpython` ran above *without* the optional dependencies, which is what proves each
      # test's guard holds. `make testoptional` is the complement: it selects exactly the tests and
      # docstring doctests that those guards skip, so they get exercised here with the dependencies
      # present. No second full `make testpython` is needed.
      #
      # This package declares no optional dependency yet (the `all` extra is an empty placeholder),
      # which makes the selection empty today. Adding the first one is a pure `pyproject.toml`
      # change.
      - name: Optional tests
        shell: bash
        run: |
          SETUPTOOLS_RUST_CARGO_PROFILE=release pip install -e ".[all]"
          make testoptional

      # The guides under `docs/` are documentation: their doctests are only meaningful when the
      # optional dependencies are present, so this deliberately runs after the step above. A skipped
      # guide doctest means that guide went unverified.
      - name: Documentation tests
        shell: bash
        run: |
          make doctest
